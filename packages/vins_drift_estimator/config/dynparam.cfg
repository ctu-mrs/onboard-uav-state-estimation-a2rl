#!/usr/bin/env python

PACKAGE='vins_drift_estimator'
import roslib;
roslib.load_manifest(PACKAGE)

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator();

process_noise = gen.add_group("a Process noise");
process_noise.add("process_noise_position_x", double_t, 1, "Process noise of x", 0.1, 0, 1000);
process_noise.add("process_noise_position_y", double_t, 1, "Process noise of y", 0.1, 0, 1000);
process_noise.add("process_noise_position_z", double_t, 1, "Process noise of z", 0.1, 0, 1000);
process_noise.add("process_noise_yaw",        double_t, 1, "Process noise of yaw", 0.1, 0, 1000);
process_noise.add("process_noise_velocity_x", double_t, 1, "Process noise of x velocity", 1.0, 0, 1000);
process_noise.add("process_noise_velocity_y", double_t, 1, "Process noise of y velocity", 1.0, 0, 1000);
process_noise.add("process_noise_velocity_z", double_t, 1, "Process noise of z velocity", 1.0, 0, 1000);
process_noise.add("process_noise_yaw_rate",   double_t, 1, "Process noise of yaw rate", 1.0, 0, 1000);

check_valid_measurement = gen.add_group("b Check valid measurement");
check_valid_measurement.add("gate_size_threshold", double_t, 1, "Threshold for gate size", 0.0, 0, 2000);

correction_noise = gen.add_group("c Correction noise");
correction_method_enum = gen.enum([gen.const("sigmoid_cn", int_t, 0, "Sigmoid function"), 
                         gen.const("single_value_cn", int_t, 1, "Single value"),
                         gen.const("fraction_cn", int_t, 2, "Fraction function"),],
                         "An enum to set method of correction noise scaling");
correction_noise.add("correction_noise_method", int_t, 0, "A correction noise method which is edited via an enum", 1, 0, 3, edit_method=correction_method_enum)
correction_noise.add("correction_noise_single_value_x", double_t, 1, "Correction noise of x", 0.1, 0, 10000);
correction_noise.add("correction_noise_single_value_y", double_t, 1, "Correction noise of y", 0.1, 0, 10000);
correction_noise.add("correction_noise_single_value_z", double_t, 1, "Correction noise of z", 0.1, 0, 10000);
correction_noise.add("correction_noise_single_value_yaw", double_t, 1, "Correction noise of yaw", 0.1, 0, 10000);

covariance_coefficient = gen.add_group("d Covariance coefficient");
covariance_coefficient.add("confidence_threshold", double_t, 1, "CNN confidence threshold", 0.5, 0, 1);

corrections_max_saturate = gen.add_group("e Correction saturation values");
corrections_max_saturate.add("enable_correction_saturation", bool_t, 1, "Enable correction saturation feature", True);
saturation_method_enum = gen.enum([gen.const("sigmoid_s", int_t, 0, "Sigmoid function"), 
                         gen.const("single_value_s", int_t, 1, "Single value"),
                         gen.const("no_saturation_s", int_t, 2, "No saturation"),],
                         "An enum to set method of saturation");
corrections_max_saturate.add("saturation_method", int_t, 0, "A saturation method which is edited via an enum", 1, 0, 3, edit_method=saturation_method_enum)
corrections_max_saturate.add("single_value_saturation_x", double_t, 1, "Saturate value for x", 1, 0, 1000);
corrections_max_saturate.add("single_value_saturation_y", double_t, 1, "Saturate value for y", 1, 0, 1000);
corrections_max_saturate.add("single_value_saturation_z", double_t, 1, "Saturate value for z", 1, 0, 1000);
corrections_max_saturate.add("single_value_saturation_yaw", double_t, 1, "Saturate value for yaw", 1, 0, 1000);

correction_skipping = gen.add_group("f Correction skipping");
correction_skipping.add("use_correction_skipping", bool_t, 1, "Use correction skipping feature", True);
correction_skipping.add("max_value_x", double_t, 1, "Maximal correction value for x (skipping too large correction)", 1.0, 0, 100);
correction_skipping.add("max_value_y", double_t, 1, "Maximal correction value for y (skipping too large correction)", 1.0, 0, 100);
correction_skipping.add("max_value_z", double_t, 1, "Maximal correction value for z (skipping too large correction)", 1.0, 0, 100);
correction_skipping.add("max_value_yaw", double_t, 1, "Maximal correction value for yaw (skipping too large correction)", 1.0, 0, 100);

exit(gen.generate(PACKAGE, "vins_drift_estimator", "dynparam"))

